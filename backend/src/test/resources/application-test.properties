# ==============================================================================
# SentinelAI Spring Boot Test Configuration (H2 In-Memory)
# ==============================================================================

spring.application.name=sentinelai-backend-test
server.port=8081

# In-memory H2 Database for Tests
spring.datasource.url=jdbc:h2:mem:sentinelaidb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT Security for Tests
sentinelai.jwt.secret=testSecretKeyForDevelopmentMustBe32BytesLongSentinelAI!
sentinelai.jwt.expiration-ms=3600000

# Mock AI Service URL
sentinelai.ai-service.base-url=http://localhost:8000/api/v1
sentinelai.ai-service.internal-token=test_internal_token_secret_12345
sentinelai.ai-service.timeout-seconds=5
