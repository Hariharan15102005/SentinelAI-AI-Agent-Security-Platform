# ==============================================================================
# SentinelAI Spring Boot Backend Configuration
# ==============================================================================

spring.application.name=sentinelai-backend
server.port=${PORT:8080}

# MySQL Datasource Configuration (Parameterized via environment variables)
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:sentinelai_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:Hari#<include>12345}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Security Settings
sentinelai.jwt.secret=${JWT_SECRET:defaultSecretKeyForDevelopmentMustBe32BytesLongSentinelAI!}
sentinelai.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# AI Service (FastAPI) Client Settings
sentinelai.ai-service.base-url=${AI_SERVICE_URL:http://localhost:8000/api/v1}
sentinelai.ai-service.internal-token=${INTERNAL_SERVICE_SECRET:sentinelai_internal_token_secret_key_2026}
sentinelai.ai-service.timeout-seconds=60

# CORS Configuration
sentinelai.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# SpringDoc OpenAPI Settings
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

